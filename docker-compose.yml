version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: nestjs-hexagonal-postgres
    restart: unless-stopped

    ports:
      - '5432:5432'

    environment:
      POSTGRES_USER: ${DATABASE_USER:-nestjs_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-nestjs_password}
      POSTGRES_DB: ${DATABASE_NAME:-nestjs_hexagonal_db}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --lc-collate=C --lc-ctype=C'
      PGDATA: /var/lib/postgresql/data/pgdata

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER:-nestjs_user} -d ${DATABASE_NAME:-nestjs_hexagonal_db}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - nestjs-network

  # NestJS Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: nestjs-hexagonal-app
    restart: unless-stopped

    ports:
      - '${PORT:-3000}:3000'

    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      # Database connection DENTRO de Docker network
      DATABASE_URL: postgresql://${DATABASE_USER:-nestjs_user}:${DATABASE_PASSWORD:-nestjs_password}@postgres:5432/${DATABASE_NAME:-nestjs_hexagonal_db}?schema=public
      LOG_LEVEL: ${LOG_LEVEL:-info}

    # Esperar a que PostgreSQL esté listo
    depends_on:
      postgres:
        condition: service_healthy

    # Healthcheck del container
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    networks:
      - nestjs-network

  # PgAdmin (opcional - UI para administrar PostgreSQL)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nestjs-hexagonal-pgadmin
    restart: unless-stopped

    ports:
      - '5050:80'

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - nestjs-network

# Volúmenes persistentes
volumes:
  postgres_data:
    driver: local
    name: nestjs-hexagonal-postgres-data

  pgadmin_data:
    driver: local
    name: nestjs-hexagonal-pgadmin-data

# Red interna
networks:
  nestjs-network:
    driver: bridge
    name: nestjs-hexagonal-network
