version: '3.8'

services:
  # PostgreSQL (misma configuración)
  postgres:
    image: postgres:16-alpine
    container_name: nestjs-hexagonal-postgres-dev
    restart: unless-stopped

    ports:
      - '5432:5432'

    environment:
      POSTGRES_USER: ${DATABASE_USER:-nestjs_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-nestjs_password}
      POSTGRES_DB: ${DATABASE_NAME:-nestjs_hexagonal_db}
      PGDATA: /var/lib/postgresql/data/pgdata

    volumes:
      - postgres_data_dev:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER:-nestjs_user}']
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - nestjs-network-dev

  # NestJS Application (Desarrollo con hot-reload)
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: nestjs-hexagonal-app-dev
    restart: unless-stopped

    ports:
      - '${PORT:-3000}:3000'
      - '9229:9229'  # Puerto para debugging

    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${DATABASE_USER:-nestjs_user}:${DATABASE_PASSWORD:-nestjs_password}@postgres:5432/${DATABASE_NAME:-nestjs_hexagonal_db}?schema=public
      LOG_LEVEL: debug
      PRISMA_QUERY_LOG: 'true'

    # Montar código fuente como volumen para hot-reload
    volumes:
      - .:/app
      - /app/node_modules  # Evitar sobrescribir node_modules del container
      - /app/dist          # Evitar sobrescribir dist del container

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - nestjs-network-dev

    # Comando con debugging habilitado
    command: npm run start:debug

volumes:
  postgres_data_dev:
    name: nestjs-hexagonal-postgres-data-dev

networks:
  nestjs-network-dev:
    name: nestjs-hexagonal-network-dev
